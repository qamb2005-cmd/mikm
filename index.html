<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik - User Manager</title>
    <link rel="stylesheet" href="styles/globals.css?v=2.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="mikrotik-logo-container">
                <img src="images/mikrotik_logo.png" class="mikrotik-logo" alt="MikroTik">
            </div>
            <h2 data-i18n="app_name">MikroTik</h2>
            <p class="subtitle" data-i18n="welcome_text">Boshqaruv paneliga xush kelibsiz</p>
            <form id="login-form">
                <div class="form-group">
                    <label data-i18n="login">Login</label>
                    <input type="text" id="login-username" data-i18n-placeholder="enter_login"
                        placeholder="Loginni kiriting" required autocapitalize="none" autocorrect="off">
                </div>
                <div class="form-group">
                    <label data-i18n="password">Parol</label>
                    <input type="password" id="login-password" data-i18n-placeholder="enter_password"
                        placeholder="Parolni kiriting" required autocapitalize="none" autocorrect="off">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px"
                    data-i18n="login_btn">Kirish</button>
                <p id="login-error" style="color: var(--danger); font-size: 13px; margin-top: 15px; display: none;"
                    data-i18n="login_error_msg">
                    Login yoki parol noto'g'ri!</p>
            </form>
            <div class="lang-switcher" style="margin-top: 24px; justify-content: center;">
                <button class="lang-btn" data-lang="uz">UZ</button>
                <button class="lang-btn" data-lang="ru">RU</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
            <!-- Login Aloqa Bo'limi (Ichki footer bilan bir xil) -->
            <div style="
                margin-top: 40px;
                padding: 18px 24px;
                background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(6,182,212,0.1));
                border: 1px solid rgba(99,179,237,0.3);
                border-radius: 20px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                text-align: left;
            ">
                <div style="display:flex; align-items:center; gap:12px">
                    <span style="font-size:24px">📞</span>
                    <div>
                        <div
                            style="font-size:11px; color:rgba(255,255,255,0.6); margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px">
                            Aloqa uchun:</div>
                        <a href="tel:+998880220909"
                            style="font-weight:800; color:white; text-decoration:none; font-size:16px">+998 88 022 09
                            09</a>
                    </div>
                </div>
                <a href="https://t.me/raxmatillayev19" target="_blank" style="
                    display:flex; align-items:center; justify-content:center; gap:10px;
                    background: linear-gradient(135deg, #229ED9, #1a7fc1);
                    color:white; text-decoration:none;
                    padding: 12px; border-radius:14px;
                    font-weight:800; font-size:15px;
                    box-shadow: 0 4px 15px rgba(34,158,217,0.4);
                    transition: all 0.3s;
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(34,158,217,0.5)'"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(34,158,217,0.4)'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path
                            d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z" />
                    </svg>
                    @raxmatillayev19
                </a>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <img src="images/mikrotik_icon.png" class="sidebar-logo-icon" alt="MikroTik">
            </div>

            <nav class="nav-links">
                <a href="#" class="nav-item active" data-view="dashboard">
                    <span data-i18n="nav_dashboard">🏠 Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-view="users">
                    <span data-i18n="nav_users">👥 User Manager</span>
                </a>
                <a href="#" class="nav-item" data-view="vouchers">
                    <span data-i18n="nav_vouchers">🎫 Vaucherlar</span>
                </a>
                <a href="#" class="nav-item" data-view="sessions">
                    <span data-i18n="nav_sessions">📶 Sessiyalar</span>
                </a>
                <a href="#" class="nav-item" data-view="sales">
                    <span data-i18n="nav_sales">💵 Sotuvlar</span>
                </a>
                <div class="nav-spacer"></div>
                <a href="#" class="nav-item" data-view="settings">
                    <span data-i18n="nav_settings">⚙️ Sozlamalar</span>
                </a>
                <a href="#" class="nav-item" id="logout-btn">
                    <span data-i18n="nav_logout">🚪 Chiqish</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button id="menu-toggle" class="menu-toggle">☰</button>
                <div class="search-bar">
                    <input type="text" data-i18n-placeholder="search_placeholder" placeholder="Qidiruv...">
                </div>
                <div class="user-profile">
                    <div class="lang-switcher" id="lang-switcher">
                        <button class="lang-btn" data-lang="uz">UZ</button>
                        <button class="lang-btn" data-lang="ru">RU</button>
                        <button class="lang-btn" data-lang="en">EN</button>
                    </div>
                    <button id="theme-toggle" class="theme-toggle" title="Kun/Tun rejim">🌓</button>
                    <div class="router-status" data-i18n="router_offline">Offline / Xatolik</div>
                    <div class="avatar" title="Profil" data-i18n-title="profile"></div>
                </div>
            </header>

            <div id="view-container" class="view-container">
                <!-- Content injected here -->
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Yangi qo'shish</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Form will be injected here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js?v=2.0"></script>
    <script src="js/app.js?v=2.0"></script>
</body>

</html>
