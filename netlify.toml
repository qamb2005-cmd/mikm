[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api-proxy"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
